services:
  edgepilot:
    build:
      context: .
      dockerfile: Dockerfile
    image: edgepilot:latest
    container_name: edgepilot
    restart: unless-stopped
    environment:
      PILOT_ADDR: ":8080"
      PILOT_DATA_DIR: "/data"
      PILOT_BASE_URL: "https://${PILOT_DOMAIN:-edgepilot.example.com}"
      # 这个 compose 里必然有 Caddy 在前面，不开的话日志里的客户端 IP 全是代理地址
      PILOT_TRUST_PROXY: "true"
      # 生产环境务必固定，重启后保持不变（影响登录态与凭据解密）
      PILOT_SECRET: "${PILOT_SECRET:?请在 .env 中设置 PILOT_SECRET}"
      TZ: "Asia/Shanghai"
    volumes:
      - edgepilot-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: edgepilot-caddy
    restart: unless-stopped
    depends_on:
      - edgepilot
    ports:
      - "80:80"
      - "443:443"
    environment:
      PILOT_DOMAIN: "${PILOT_DOMAIN:-edgepilot.example.com}"
      ACME_EMAIL: "${ACME_EMAIL:-admin@example.com}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  edgepilot-data:
  caddy-data:
  caddy-config:
